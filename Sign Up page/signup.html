<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Tiffen Box</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- MAIN PAGE -->
    <div class="page">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                <div class="brand-icon"><img src="../images/logo.jpeg" height="45" width="80" alt="" style="background-color: antiquewhite;"></div>
                <!-- <span>Tiffen Box</span> -->
            </div>

            <a href="#" class="help">
                Help
            </a>

        </header>


        <!-- ================= SIGNUP AREA ================= -->

        <main class="signup-area">

            <div class="signup-card">

                <!-- ================= LEFT FORM ================= -->

                <section class="signup-form">

                    <div class="form-content">

                        <span class="eyebrow">
                            GET STARTED
                        </span>

                        <h1>
                            Your better lunch starts<br>
                            here.
                        </h1>

                        <p class="description">
                            Create an account and make weekday meals easy.
                        </p>


                        <!-- Full Name -->

                        <div class="input-group">

                            <label for="name">
                                Full name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Aarav Mehta"
                            >

                        </div>


                        <!-- Email -->

                        <div class="input-group">

                            <label for="email">
                                Email address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="aarav@example.com"
                            >

                        </div>


                        <!-- Password -->

                        <div class="input-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                            >

                        </div>


                        <!-- Terms -->

                        <label class="terms">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span>
                                I agree to the Terms and Privacy Policy
                            </span>

                        </label>


                        <!-- Create Account -->

                        <button class="create-btn">
                            Create account
                        </button>


                        <!-- Login -->

                        <p class="login-text">
                            Already have an account?
                            <a href="#">Log in</a>
                        </p>

                    </div>

                </section>


                <!-- ================= IMAGE ================= -->

                <section class="food-section">

                    <img
                        src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=1000&q=85"
                        alt="Indian meal"
                    >

                    <div class="image-overlay"></div>

                    <div class="image-caption">

                        <h2>
                            Packed with care
                        </h2>

                        <p>
                            Ella Olsson / Unsplash
                        </p>

                    </div>

                </section>

            </div>

        </main>

    </div>

</body>
</html>
