<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Tiffen Box</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Main page -->
    <div class="page">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                <div class="brand-icon">✥</div>
                <span>Tiffen Box</span>
            </div>

            <a href="#" class="help">
                Help
            </a>

        </header>


        <!-- ================= LOGIN AREA ================= -->

        <main class="login-area">

            <div class="login-card">

                <!-- ================= LEFT LOGIN FORM ================= -->

                <section class="login-form">

                    <div class="form-content">

                        <span class="eyebrow">
                            WELCOME BACK
                        </span>

                        <h1>
                            Good food, right on time.
                        </h1>

                        <p class="description">
                            Sign in to manage your weekly tiffin deliveries.
                        </p>


                        <!-- Email -->

                        <div class="input-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                            >

                        </div>


                        <!-- Password -->

                        <div class="password-heading">

                            <label for="password">
                                Password
                            </label>

                            <a href="#">
                                Forgot password?
                            </a>

                        </div>

                        <div class="input-group password-input">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                            >

                        </div>


                        <!-- Login -->

                        <button class="login-btn">
                            Log in
                        </button>


                        <!-- Signup -->

                        <p class="signup-text">
                            New to Tiffen Box?
                            <a href="#">
                                Create an account
                            </a>
                        </p>

                    </div>

                </section>


                <!-- ================= FOOD IMAGE ================= -->

                <section class="food-section">

                    <img
                        src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=1000&q=85"
                        alt="Fresh Indian tiffin meal"
                    >

                    <div class="image-overlay"></div>

                    <div class="image-caption">

                        <h2>
                            Freshly packed.<br>
                            Made for your day.
                        </h2>

                        <p>
                            Ella Olsson / Unsplash
                        </p>

                    </div>

                </section>

            </div>

        </main>

    </div>

</body>
</html>
