<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Tiffen Box</title>


    <link rel="stylesheet" href="forgetpass.css">
</head>

<body>



    <!-- Main page -->
    <div class="page">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                <div class="brand-icon">✥</div>
                <span>Tiffen Box</span>
            </div>

            <a href="#" class="help">
                Help
            </a>

        </header>


        <!-- ================= FORGOT PASSWORD CARD ================= -->

        <main class="main-content">

            <div class="forgot-card">

                <!-- Key icon -->

                <div class="key-icon">
                    ⚿
                </div>


                <!-- Heading -->

                <div class="account-label">
                    ACCOUNT ACCESS
                </div>

                <h1>
                    Forgot your password?
                </h1>

                <p class="description">
                    Enter your email and we'll send a secure reset link.
                </p>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                    >

                </div>


                <!-- Reset button -->

                <button class="reset-btn">
                    Send reset link
                </button>


                <!-- Expiration -->

                <p class="expiry">
                    The link expires in 30 minutes.
                </p>


                <!-- Back -->

                <a href="#" class="back-login">
                    <span>←</span>
                    Back to log in
                </a>

            </div>

        </main>

    </div>

</body>
</html>
